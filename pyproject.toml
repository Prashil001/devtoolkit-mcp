[project]
name = "devtoolkit-mcp"
version = "0.1.0"
description = "An open-source MCP server providing essential software development tools for AI assistants."
readme = "README.md"
authors = [
    { name = "Prashil001", email = "151838442+Prashil001@users.noreply.github.com" }
]
license = "MIT"
requires-python = ">=3.11"
keywords = [
    "mcp",
    "model-context-protocol",
    "developer-tools",
    "python",
    "ai",
    "code-analysis"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

dependencies = [
    "fastmcp>=4.1.6",
    "httpx>=0.28.1",
    "packaging>=26.3",
]

[project.scripts]
devtoolkit-mcp = "devtoolkit_mcp.server:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[project.urls]
Homepage = "https://github.com/Prashil001/devtoolkit-mcp"
Repository = "https://github.com/Prashil001/devtoolkit-mcp"
Issues = "https://github.com/Prashil001/devtoolkit-mcp/issues"
