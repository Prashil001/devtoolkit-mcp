[project]
name = "devtoolkit-mcp"
version = "0.1.0"
description = "An open-source MCP server providing essential software development tools for AI assistants."
readme = "README.md"
authors = [
    { name = "Prashil001", email = "151838442+Prashil001@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.1.6",
    "httpx>=0.28.1",
    "packaging>=26.3",
]

[project.scripts]
devtoolkit-mcp = "devtoolkit_mcp.server:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
